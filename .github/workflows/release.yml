name: Releaser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Pantry
        uses: home-lang/pantry/packages/action@main

      - name: Install Dependencies
        run: bun install

      # `pantry publish` does not run npm's prepublishOnly lifecycle, so
      # without this the package ships whatever dist happens to be in the tree.
      # That is how a fix could sit in src, released and version-bumped, while
      # every consumer kept running the old build.
      - name: Build
        run: bun --bun run build

      - name: Publish
        run: pantry publish --npm --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: stacksjs/action-releaser@v1.2.9
        with:
          files: |
            packages/logsmith/bin/logsmith-linux-x64.zip
            packages/logsmith/bin/logsmith-linux-arm64.zip
            packages/logsmith/bin/logsmith-windows-x64.zip
            packages/logsmith/bin/logsmith-darwin-x64.zip
            packages/logsmith/bin/logsmith-darwin-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
